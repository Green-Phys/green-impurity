name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    strategy:
      fail-fast: false

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev lcov libeigen3-dev cmake libopenmpi-dev openmpi-bin

      - name: Build
        run: |
          mkdir build && cd build;
          cmake -DCMAKE_CXX_FLAGS=" --coverage -fno-inline -fno-inline-small-functions -fno-default-inline -fprofile-arcs -ftest-coverage " ..;
          make -j 4;

      - name: Test
        env:
          OMP_NUM_THREADS: 1
        run: |
          cd build;
          ctest -j1 --output-on-failure;

      - name: Upload build dir
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build

  coverage:
    needs: [build]
    strategy:
      fail-fast: false

    runs-on: ubuntu-latest

    steps:
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Download build dir
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build

      - name: Run coverage
        run: |
          cd build;
          lcov --capture --directory . --output-file coverage.info --ignore-errors source;
          lcov --remove coverage.info '/usr/*' --output-file coverage.info --ignore-errors unused
          lcov --remove coverage.info '/opt/ohpc/pub/compiler/*' --output-file coverage.info --ignore-errors unused
          lcov --remove coverage.info '*_deps*' --output-file coverage.info --ignore-errors unused
          lcov --remove coverage.info '*deps*' --output-file coverage.info --ignore-errors unused
          lcov --remove coverage.info '*libs*' --output-file coverage.info --ignore-errors unused
          lcov --list coverage.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          flags: unittests
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

